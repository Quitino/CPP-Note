title: "CPP-Note"
description: "C++ 学习笔记，覆盖基础到进阶知识"

remote_theme: just-the-docs/just-the-docs

url: "https://Quitino.github.io"
baseurl: "/CPP-Note"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# just-the-docs 配置
color_scheme: light
search_enabled: true
heading_anchors: true
nav_sort: order

footer_content: "CPP-Note &copy; 2024 | C++ 学习笔记"

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gemspec"
  - vendor/
